[package]
name = "ccm-reproduction"
version = "2.5.0"
edition = "2021"
rust-version = "1.98"
description = "Independent reproduction and convergence analysis of the CCM Zeta Spectral Triple (arXiv:2511.22755)"
authors = ["Ronnie Andrews, Jr. <5178942+TeamXceleratorDev@users.noreply.github.com>"]
license-file = "LICENSE"

[features]
default = []
# High-precision tier via rug (MPFR/GMP). Required for meaningful results.
# Build: cargo build --release --features hp
# Requires: sudo apt install build-essential m4 libgmp-dev libmpfr-dev libmpc-dev
hp = ["xc-spectral/hp", "xc-zeta/hp", "xc-numerics/hp", "dep:rug"]
# Optional FLINT/Arb-backed certification of independently indexed roots from
# the exact retained finite CCM point source. This is deliberately separate
# from ordinary HP computation. Ultra builds enable this feature for finite
# transform enclosures; root/sector certification still requires an explicit request.
root-certification = ["hp", "xc-spectral/arb"]
# Local/native qualification surface for the Toolkit's default-off GL
# root scheduler. Ordinary reproduction builds do not enable it.
experimental-gl-root-parallel = ["hp"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "integer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Xcelerator Toolkit v0.15.1; the qualified commit and Cargo.lock bind each run.
xc-spectral = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "ec0f09cb1a0a133dfb62c7bceceff2c1669a429c" }
xc-zeta = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "ec0f09cb1a0a133dfb62c7bceceff2c1669a429c" }
xc-numerics = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "ec0f09cb1a0a133dfb62c7bceceff2c1669a429c" }
xc-cache = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "ec0f09cb1a0a133dfb62c7bceceff2c1669a429c" }
xc-core = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "ec0f09cb1a0a133dfb62c7bceceff2c1669a429c" }

[profile.release]
opt-level = 3
lto = "thin"
