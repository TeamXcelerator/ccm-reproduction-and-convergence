[package]
name = "ccm-reproduction"
version = "2.3.0"
edition = "2021"
description = "Independent reproduction and convergence analysis of the CCM Zeta Spectral Triple (arXiv:2511.22755)"
authors = ["Ronnie Andrews, Jr. <5178942+TeamXceleratorDev@users.noreply.github.com>"]
license-file = "LICENSE"

[features]
default = []
# High-precision tier via rug (MPFR/GMP). Required for meaningful results.
# Build: cargo build --release --features hp
# Requires: sudo apt install build-essential m4 libgmp-dev libmpfr-dev libmpc-dev
hp = ["xc-spectral/hp", "xc-zeta/hp", "xc-numerics/hp", "dep:rug"]
# Optional FLINT/Arb-backed certification of independently indexed roots from
# the exact retained finite CCM point source. This is deliberately separate
# from ordinary HP computation.
root-certification = ["hp", "xc-spectral/arb"]
# Local/native qualification surface for Toolkit v0.13.5's default-off GL
# root scheduler. Ordinary reproduction builds do not enable it.
experimental-gl-root-parallel = ["hp"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "integer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Xcelerator Toolkit v0.13.5. The immutable release tag and Cargo.lock bind
# every claim run to the qualified numerical and artifact-format milestone.
xc-spectral = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", tag = "v0.13.5" }
xc-zeta     = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", tag = "v0.13.5" }
xc-numerics = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", tag = "v0.13.5" }

[profile.release]
opt-level = 3
lto = "thin"
