[package]
name = "ccm-reproduction"
version = "1.4.2"
edition = "2021"
description = "Independent reproduction and convergence analysis of the CCM Zeta Spectral Triple (arxiv 2511.22755)"
authors = ["Ronnie Andrews, Jr. <5178942+TeamXceleratorDev@users.noreply.github.com>"]
license-file = "LICENSE"

[features]
default = []
# High-precision tier via rug (MPFR/GMP). Required for meaningful results.
# Build: cargo build --release --features hp
# Requires: sudo apt install build-essential m4 libgmp-dev libmpfr-dev libmpc-dev
hp = ["xc-spectral/hp", "xc-zeta/hp", "xc-numerics/hp", "dep:rug"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "integer"] }

# Xcelerator Toolkit v0.13.0. Cargo.lock pins the exact resolved main-branch
# revision so claim runs remain reproducible.
xc-spectral = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", branch = "main" }
xc-zeta     = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", branch = "main" }
xc-numerics = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", branch = "main" }

[profile.release]
opt-level = 3
lto = "thin"
